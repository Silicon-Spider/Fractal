# Fractal provenance: copied from Temporal-5D (https://github.com/Silicon-Spider/temporal-5d)
#   source: oracles/known-divergences.toml
#   commit: c8a9c490bfde650466609531f8083d69513c6036
#   copied: 2026-11-08 (Fractal spec 3.1 and 3.4; decisions NR1, NR5)
#   state:  changed: ftxi's entries at the pin bump to v0.5.2 (Fractal G1a ruling 2); see PROVENANCE.md
# Known divergences: places where an oracle is wrong and the engine is right.
#
# When the engine and an oracle disagree, the rulebook decides. If the engine is
# wrong, fix the engine. If the oracle is wrong, record it here - with the rule
# that settles it - and report it upstream. Any disagreement that is not recorded
# here fails the gate.
#
# An entry excuses exactly one observation: this oracle, at this pin, on this
# record, at this position, saying this, where the engine says that. It stops
# matching (and the gate fails) if either value changes, if the oracle's pin
# moves, or if the disagreement stops occurring. What it says the oracle answers
# is checked against the golden files. It is not a way to make a red gate green:
# an entry without a citation is rejected.
#
# The citation is to the rulebook - except where the notation specification
# settles it, and then it is cited instead: give `notation = "..."` in place of
# `rulebook`.
#
#   * A parse divergence (kind "placement"): the oracle set up different boards
#     from the engine's - other pieces, or the same pieces at other coordinates:
#     it read the record's move text, or its set-up, otherwise. That is always
#     the notation's to settle, and needs `notation`.
#   * A marker-only parse divergence (kind "unmoved"): the same boards and
#     pieces, marked unmoved differently. The notation's "5DFEN Strictness" says
#     which pieces carry the marker and the rulebook what having moved means:
#     either may settle it. Its index is the first position of a run of
#     positions whose markers differ, and it excuses that run; markers that part
#     again after agreeing need an entry of their own.
#   * An oracle that refuses an action because it could not match the move
#     text to a move (oracle_value "rejected:no_matching_move",
#     "rejected:ambiguous_move", "rejected:notation_mismatch" or
#     "rejected:unrecognised"), or that read a different number of actions
#     (kind "length"), may be stopped by notation it does not read and not by a
#     rule. If that is what it is, cite the notation specification - or, where
#     the specification is silent on how such text is read, the rulebook's
#     project decision that settles it (R11: a capture mark that disagrees with
#     its move). If the oracle really does hold the move illegal, it is a rules
#     matter after all and needs the rulebook like any other.
#   * The engine refusing as unreadable text an oracle played, in either mode
#     (kind "legality", engine_value "rejected:unreadable", oracle_value
#     "accepted"), at the action it could not read - index 0 being the
#     record's set-up, its headers or board strings. Whether that text is valid
#     is the notation specification's to say: such an entry must cite it, never
#     the rulebook.
#
# Every entry is also a telltale (decision H34): an engine that comes to agree
# with the oracle's recorded error - by the comparison's own rule, so refusing
# an action the oracle wrongly refused for any reason counts - fails the gate,
# and the entry is never reported stale for it. Never remove an entry to make
# that finding go away.
#
# The first entries (KD-0001 to KD-0056, 2026-10-02) come from the engine's first
# gate runs, triaged against the rulebook and the CHECKPOINT 1 rulings
# (docs/rules/README.md R1-R7): ftxi's check verdicts that R1 rules wrong; Chess
# in 5D's two false checkmates and ftxi's missing Black two-timeline double step
# (the two defects drafted for upstream in docs/checkpoints/upstream/, recorded
# here as telltales, R7); record text the notation specification rules out, which
# the engine refuses and an oracle played; and oracles' own notation errors. The
# differences rules Q4 (moves after the present has shifted) explained never had
# an entry: R8 ruled it, and the engine has followed the ruling by default since
# stage E7.
#
# KD-0057 to KD-0166 (2026-10-17) come from the first runs with the engine
# configured in gate.toml, which under R8 reads records further: ftxi's and
# ftxi:naive's check verdicts that R1 rules wrong at the positions it now reaches -
# each re-checked against the engine's own capture scan and ftxi's account of its
# check test (`observe --explain`), cwmtt/many2's among them (read converted since
# CHECKPOINT 3, so not in CHECKPOINT 1's table). Some sit beyond a tier's budgets:
# an entry that a run does not reach is not looked at, and is never reported stale
# for it.
#
# KD-0170 (2026-10-17) follows the project owner's ruling on the capture mark
# (CHECKPOINT 8: docs/rules/README.md R11, register H51, a project decision). The
# notation's "Jumps" syntax writes x "if a piece is being taken" and says nothing
# of a reader that meets a mark that disagrees with its move; the ruling: a move is
# read as its squares define it, the mismatch logged as a warning, and a source
# that refuses such a record gets an entry citing the ruling. The engine's reader
# now reads cwmtt/futures action 17 - an x on a jump that takes nothing - as
# cwmtt, Chess in 5D and the notation parser do, and ftxi's refusal of it is
# KD-0170. KD-0167 to KD-0169, which recorded those three's playing it while the
# engine's reader refused a written x that takes nothing (a reading put to the
# owner as spec issue 125, and marked provisional), were withdrawn in the same
# edit, on the ruling's authority: it says the oracles that played the move made
# no error, so withdrawing them is not removing an entry to silence a telltale
# (above). Their ids are not reused.
#
# The 147 entries ruling R1 settles - ftxi's and ftxi:naive's check verdicts at 92
# positions of 12 records - are answered by one question to ftxi's author (the
# owner's ruling at CHECKPOINT 8, register H27: a disagreement with a documented
# rule is reported as a question citing the source, not as a bug), drafted in
# docs/checkpoints/upstream/ftxi-check-test-passed-boards.md for the project owner
# to file. Once it is filed, its URL takes the place of their `upstream`. If the
# answer shows that the game passes the boards ftxi passes, the rulebook is wrong:
# R1 is put to the owner again, and these entries with it.
#
# 2026-11-28, in Fractal: ftxi's pin moved from v0.4.10 to v0.5.2 (G1a ruling 2;
# docs/gates/G1a-ftxi-pin.md). Between the two, ftxi's f66c4ee has its check test
# pass only the active boards at the present, which is R1's reading, and its
# 18df77d gives Black's pawns the two-timeline double step. Both gate tiers then
# reported 151 entries as no longer occurring, and they were removed: the 147
# check verdicts of the paragraph above, and KD-0040 to KD-0043 (the double
# step). At each of them ftxi now gives the answer the engine gave all along;
# no answer of the engine's moved, so no entry was removed to silence a
# telltale. Their ids are not reused. The ten ftxi entries that still occur were
# checked against the recordings made at the new pin and carry it. ftxi's two
# changes settle what the two questions drafted for its author, about the check
# test and about the double step, would have asked.
#
# KD-0171 and KD-0172 are new at that pin: v0.5.2 reads Standard - Half Reflected,
# which v0.4.10 did not, and sets it up with White's king and queen exchanged
# where the game exchanges Black's.
#
# [[divergence]]
# id = "KD-0001"
# oracle = "chessin5d"            # the source that is wrong: ftxi | ftxi:naive | cwmtt | cwmtt:naive | chessin5d | notation
#                                 # (for kind legality or length: the implementation - ftxi | cwmtt | chessin5d | notation)
# pin = "ee403c80e8c132fc4d168f5b99ddd9b8fe5cc17b"   # that oracle's locked commit when this was verified
# record = "cwmtt/standard"       # corpus record id
# record_sha256 = "..."           # its sha256 in corpus/manifest.toml (its `converted`, where it has one)
# kind = "in_check"               # side | in_check | legal_actions | terminal | legality | length | placement | unmoved
# index = 13                      # position index (action number for legality and length; 0 is the set-up)
# engine_value = "True"           # both values exactly as the gate prints them (for placement and
# oracle_value = "False"          # unmoved: the hash with its counts, "<32 hex digits> (2 boards, 63 pieces)")
# rulebook = "..."                # the rule that settles it, and where it is stated
#                                 # (or, where the notation settles it - see above: notation = "...")
# upstream = "https://..."        # the report, or "unreported: <why>"
# added = "2026-10-01"
# notes = ""
schema = 1

