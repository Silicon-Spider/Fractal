rulebook = "docs/rules/README.md R11 (register H51; a project decision, CHECKPOINT 8): capture marks are read leniently. The notation specification (README of adri326/5dchess-notation, oracles/third_party/notation/README.md, 'Jumps': 'x if a piece is being taken') says when to write the mark and not how to read one that disagrees with its move, so a move is read as its squares and boards define it, whether or not it is written with x; a mark that disagrees is logged as a warning and never changes which move is read; and a source that refuses a record for such a mark gets an entry citing the ruling. The record's '(L1T5)Qf4>>x(L0T5)e4~' (line 14, action 17) writes x on a branching jump onto (0T5)e4, an empty square: read by its squares it is White's queen from (+1T5)f4 to (0T5)e4, which takes nothing - the move the engine plays (with the warning), as cwmtt, Chess in 5D and the notation parser play it. ftxi refuses the text as matching no move: a strict reading of the mark, which R11 does not follow."
upstream = "unreported: ftxi reads the capture mark strictly where the notation specification is silent, and R11 is a project decision (H51) - no defect to report, and no documented rule to question"
added = "2026-10-17"
notes = "Triage 2026-10-17, after the user's ruling on spec issue 125 (CHECKPOINT 8: register H51, rulebook R11). At position 16 the engine, ftxi, cwmtt and Chess in 5D hold one state (fingerprint 4f663c0054865244a62f8f37d62f310f; the notation parser the same boards and pieces), and (0T5)e4 is empty. ftxi's own listing of its legal actions there (observe --source ftxi --record cwmtt/futures --actions 16) holds the one-move action (+1T5)f4 -> (0T5)e4, and its refusal names the move it parsed with the capture flag set ('Invalid move: ... pn:Q,ff:f,fr:4,ji:>>,cp:yes,tb:ab{s:0,l:0,t:5},tf:e,tr:4'): it refuses the mark, not the move - a reading of notation, not a rules verdict. The engine read the mark strictly until this ruling, and refused the action as ftxi does; KD-0167 to KD-0169, which recorded cwmtt's, Chess in 5D's and the notation parser's playing it, were withdrawn on the ruling's authority (the file's header). ftxi follows the record no further than position 16, so it stands behind none of the engine's positions after it."

